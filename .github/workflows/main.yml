name: Build MySQL Workbench (via Ubuntu 20.04 chroot)

on:
  push:
    branches: [ main ] # Or your main development branch
  pull_request:
    branches: [ main ] # Or your main development branch
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    # Use a modern runner capable of running chroot and downloading tools
    runs-on: ubuntu-latest # e.g., ubuntu-22.04 or later

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Ensure dwarfs_ tool is checked out if it's in the repo root
        # If dwarfs_ is hosted elsewhere, adjust the download step below
        submodules: 'recursive'

    - name: Install Host Dependencies (wget)
      run: sudo apt-get update && sudo apt-get install -y wget

    - name: Prepare dwarfs_ Tool
      run: |
        # Assuming dwarfs_ is in the repo root, otherwise download it first
        if [ ! -f dwarfs_ ]; then
          echo "ERROR: dwarfs_ executable not found in repository root."
          # Add commands here to download dwarfs_ if it's not checked out
          # Example: wget <URL_TO_DWARFS_BINARY> -O dwarfs_
          exit 1
        fi
        chmod +x dwarfs_
        echo "dwarfs_ tool is ready."

    - name: Download Ubuntu 20.04 dwarf Image
      run: |
        echo "Downloading Ubuntu 20.04 dwarf image..."
        wget --no-verbose https://github.com/FDrach/quick-debootstrap-images/releases/download/ubuntu-20.04-build-14666090885/20.04.dwarf -O 20.04.dwarf
        ls -lh 20.04.dwarf

    - name: Extract Ubuntu 20.04 Image for Chroot
      run: |
        mkdir 20.04
        echo "Extracting image (requires sudo)..."
        sudo ./dwarfs_ --tool=dwarfsextract -i 20.04.dwarf -o 20.04
        echo "Image extracted to ./20.04/"
        # Verify extraction (optional)
        sudo ls -l 20.04/

    - name: Prepare Chroot Environment
      run: |
        echo "Mounting necessary filesystems into chroot (requires sudo)..."
        sudo mount --bind /dev ./20.04/dev
        sudo mount --bind /dev/pts ./20.04/dev/pts
        sudo mount -t proc proc ./20.04/proc
        sudo mount -t sysfs sys ./20.04/sys
        # Ensure network connectivity inside chroot
        sudo cp /etc/resolv.conf ./20.04/etc/resolv.conf
        # Mount the workspace into the chroot to access source code and place build artifacts
        sudo mkdir -p ./20.04/workspace
        sudo mount --bind ${{ github.workspace }} ./20.04/workspace
        echo "Chroot environment prepared."

    - name: Execute Build Script inside Chroot
      run: |
        echo "Creating build script for chroot..."
        cat << 'EOF' > build_in_chroot.sh
        #!/bin/bash
        set -ex # Exit on error, print commands

        echo "--- Inside chroot ---"
        echo "Current directory: $(pwd)" # Should be /
        ls -l /

        # Mount point check
        echo "Workspace content:"
        ls -l /workspace

        # Environment setup
        export DEBIAN_FRONTEND=noninteractive
        export LANG=C.UTF-8 # Avoid locale issues

        # --- Start of original build steps, adapted for chroot ---

        echo "Updating Apt Cache..."
        apt-get update

        echo "Install software-properties-common"
        apt-get install software-properties-common -y

        echo "Add Universe repo"
        apt-add-repository universe

        echo "Updating Apt Cache..."
        apt-get update

        echo "Removing Conflicting iodbc (if present)..."
        apt-get remove -y iodbc || true

        echo "Installing Build Dependencies..."
        apt-get install -y --no-install-recommends \
          build-essential \
          cmake cmake-data \
          autoconf automake pkg-config libtool \
          libzip-dev libxml2-dev \
          libsigc++-2.0-dev \
          libglu1-mesa-dev libgl1-mesa-glx mesa-common-dev \
          libmysqlclient-dev libmysqlcppconn-dev \
          uuid-dev \
          libpixman-1-dev \
          libpcre3-dev \
          libpango1.0-dev libcairo2-dev \
          python3-dev \
          python3-pip \
          libboost-all-dev \
          mysql-client \
          python-pysqlite2 \
          libsqlite3-dev \
          swig \
          libgdal-dev \
          libgtk-3-dev libgtkmm-3.0-dev \
          libssl-dev \
          libsecret-1-dev \
          libproj-dev \
          wget # Needed for ANTLR download inside chroot

        echo "Download ANTLR JAR..."
        # Note: Downloading inside chroot to ensure it uses chroot's network config
        cd /workspace
        wget --no-verbose https://www.antlr.org/download/antlr-4.13.2-complete.jar -O antlr-complete.jar
        echo "ANTLR JAR downloaded."
        ls -l antlr-complete.jar

        echo "Configure Build with CMake..."
        mkdir -p /workspace/build # Create build dir inside the mounted workspace
        cd /workspace/build
        # Source code is at /workspace
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DWITH_ANTLR_JAR=/workspace/antlr-complete.jar \
          -DUSE_UNIXODBC=True \
          -DINSTALL_SCRIPTDIR=bin

        echo "Build MySQL Workbench..."
        NUM_CORES=$(nproc)
        echo "Building with ${NUM_CORES} cores..."
        make -j${NUM_CORES}

        echo "Create Installation Directory (Simulated Install)..."
        # Install into a temporary directory *within the mounted workspace*
        # This path (/workspace/build/install-root) will be accessible
        # from the host runner at ${{ github.workspace }}/build/install-root
        make install DESTDIR=/workspace/build/install-root

        echo "--- Exiting chroot ---"
        exit 0
        EOF

        # Make the script executable
        chmod +x build_in_chroot.sh

        echo "Entering chroot to execute build script (requires sudo)..."
        # Copy the script inside chroot (though binding workspace makes it accessible, copying avoids path issues)
        sudo cp build_in_chroot.sh ./20.04/tmp/build_in_chroot.sh
        # Execute the script within the chroot environment
        sudo chroot ./20.04 /bin/bash /tmp/build_in_chroot.sh

        echo "Build script execution finished."

    - name: Package Build Artifact
      # This runs on the host runner, accessing files via the mounted workspace
      run: |
        echo "Packaging artifact from host..."
        # The DESTDIR was ./20.04/workspace/build/install-root from chroot's perspective
        # Which is ${{ github.workspace }}/build/install-root on the host
        cd ${{ github.workspace }}/build/install-root
        ls -l . # Verify content before tarring
        # Create a tarball of the installed files
        tar -czvf ../mysql-workbench-ubuntu-20.04.tar.gz .
        cd ${{ github.workspace }} # Go back to workspace root
        ls -lh build/mysql-workbench-ubuntu-20.04.tar.gz

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mysql-workbench-ubuntu-20.04
        # Path relative to the host runner's workspace
        path: ${{ github.workspace }}/build/mysql-workbench-ubuntu-20.04.tar.gz
        retention-days: 7 # Optional: Adjust artifact retention time
